# ============================
# Server Configuration
# ============================
server.port=8080

# ============================
# MySQL Database Configuration
# ============================
spring.datasource.url=jdbc:mysql://localhost:3306/food_ordering_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================
# JPA / Hibernate Configuration
# ============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ============================
# JWT Configuration
# ============================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# ============================
# Logging (helps debugging while developing)
# ============================
logging.level.org.springframework.security=DEBUG
logging.level.com.foodorder.foodorderingsystem=DEBUG